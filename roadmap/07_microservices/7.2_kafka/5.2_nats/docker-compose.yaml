version: '3.8'
  services:
    nats:
      image: nats:latest
      ports:
        - "4222:4222"   # NATS client port
        - "8222:8222"   # Monitoring port
      command: -js      # Включаем JetStream

    nats-jetstream:
      image: nats:latest
      ports:
        - "4223:4222"
        - "8223:8222"
      command: -js
      environment:
        - NATS_STORE_DIR=/data
      volumes:
        - nats-data:/data

  volumes:
    nats-data: