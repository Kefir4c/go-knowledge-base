server {
    listen 80;

    location / {
        return 200 "hello from nginx\n";
        add_header Content-Type text/plain;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /backend {
        # Просто возвращаем что-то, чтобы nginx был полезен.
        return 200 "would proxy to app:8080\n";
        add_header Content-Type text/plain;
    }
}