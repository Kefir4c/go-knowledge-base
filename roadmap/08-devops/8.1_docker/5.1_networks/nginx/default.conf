upstream backend {
    # DNS-имя сервиса в сети frontend/backend.
    server backend:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Served-By "nginx-gateway" always;
    }

    location /health {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # Проксируем метрики Prometheus — специально заходим
    # через nginx, чтобы показать, что он видит monitoring.
    location /metrics {
        proxy_pass http://prometheus:9090/metrics;
    }
}