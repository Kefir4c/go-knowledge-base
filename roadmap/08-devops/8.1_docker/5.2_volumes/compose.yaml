name: ${COMPOSE_PROJECT_NAME:-volumes-watch}

services:
  # NGINX — точка входа, в сетях frontend + backend
  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-volumes-watch}-nginx
    hostname: nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    environment:
      TZ: Europe/Moscow
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      writer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGTERM
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    labels:
      com.example.service: "gateway"
      com.example.tier: "frontend"
    networks:
      frontend:
        aliases:
          - gateway
          - web

  # POSTGRES — только backend, internal, init-скрипты
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-volumes-watch}-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      com.example.service: "database"
      com.example.tier: "backend"
    networks:
      backend:
        aliases:
          - db
          - database

  # WRITER — пишет в named volume, non-root, только backend
  writer:
    image: alpine:3.19
    container_name: ${COMPOSE_PROJECT_NAME:-volumes-watch}-writer
    hostname: writer
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c "echo 'writer started';
        while true; do
          echo \"$(date -Iseconds) tick\" >> /data/log.txt;
          sleep 5;
        done"
    environment:
      TZ: Europe/Moscow
      INTERVAL: "5"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/data/log.txt"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    labels:
      com.example.service: "writer"
      com.example.tier: "backend"
    networks:
      backend:

# VOLUMES
volumes:
  pgdata:
    labels:
      com.example.purpose: "postgres-data"
  appdata:
    labels:
      com.example.purpose: "writer-data"
  nginx-logs:
    labels:
      com.example.purpose: "nginx-logs"

# NETWORKS
networks:
  frontend:
    driver: bridge
    labels:
      com.example.tier: "frontend"
  backend:
    driver: bridge
    internal: true
    labels:
      com.example.tier: "backend"