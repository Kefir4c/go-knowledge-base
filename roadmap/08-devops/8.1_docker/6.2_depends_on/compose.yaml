name: ${COMPOSE_PROJECT_NAME:-depends-demo}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      backend:

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      backend:
    expose:
      - "6379"

  migrate:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-migrate
    depends_on:
      postgres:
        condition: service_healthy    # ← ждём pg_isready
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "
        CREATE TABLE IF NOT EXISTS users (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          email TEXT UNIQUE NOT NULL,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS visits (
          id BIGSERIAL PRIMARY KEY,
          user_id UUID,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        INSERT INTO schema_version (version) VALUES (1)
          ON CONFLICT (version) DO NOTHING;
      "
    restart: "no"                     # ← одноразовая задача
    networks:
      backend:

  app:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully   # ← ждём exit 0
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:80" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      backend:

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      app:
        condition: service_healthy    # ← ждём healthcheck app
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
         max-size: "10m"
         max-file: "3"
    networks:
      frontend:
      backend:

volumes:
  pgdata:
  redisdata:

networks:
  frontend:
  backend:
    internal: true