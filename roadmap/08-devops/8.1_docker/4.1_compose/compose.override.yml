services:
  nginx:
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:${ADMINER_PORT}:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy