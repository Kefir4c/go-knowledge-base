version: '3.8'

services:
  # POSTGRES — БД с healthcheck и named volume
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healtcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    restart: unles-stopped
    networks:
      - backend
    expose:
      - "5432"

  # REDIS — кэш с named volume
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]      
    volumes:
      - redisdata:/data
    healtcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      restart: unles-stopped
    networks:
      - backend
    expose:
      - "6379"

  # NGINX — публикует порт наружу, стоит в frontend и backend
  nginx:
    image: nginx:1.27-alpine
    ports: 
      - "${NGINX_PORT}:80"            
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unles-stopped
    networks:
      - frontend
      - backend      

# ADMINER — UI для Postgres (опционально, через profiles)
adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    profiles:
      - tools      

# VOLUMES — named, управляются Docker
volumes:
  pgdata:
  redisdata:
  nginx-logs:

# NETWORKS — изоляция frontend и backend
networks:
  frontend:
  backend: