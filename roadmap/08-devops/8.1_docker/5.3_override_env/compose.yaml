name: ${COMPOSE_PROJECT_NAME:-compose-practice}

services:

 # NGINX — точка входа. Публикует порт, зависит от redis.
  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    ports:
      - "${NGINX_PORT}:80"
    environment:
      NGINX_HOST: ${COMPOSE_PROJECT_NAME}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGTERM
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    labels:
      com.example.tier: frontend
      com.example.service: nginx
    networks:
      frontend:
        aliases:
          - gateway
          - web

  # REDIS — кэш. Только expose, никаких ports.
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly", "yes"]
    volumes:
      -redisdata:/data
    environment:
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop-grace-period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      com.example.tier: backend
      com.example.service: redis
    networks:
      backend:
        aliases:
          - cache
    expose:
      - "6379"      

# POSTGRES — БД. Внутренняя сеть, без ports.
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      TZ: Europe/Moscow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      com.example.tier: backend
      com.example.service: postgres
    networks:
      backend:
        aliases:
          - db
          - database
    expose:
      - "5432"

volumes:
  pgdata:
    labels:
      com.example.purpose: postgres-data
  redisdata:
    labels:
      com.example.purpose: redis-data

networks:
  frontend:
    driver: bridge
    labels:
      com.example.tier: frontend
  backend:
    driver: bridge
    internal: true
    labels:
      com.example.tier: backend      