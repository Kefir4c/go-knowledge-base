name: ${COMPOSE_PROJECT_NAME:-graceful-go}

services:

  # GRACEFUL — правильный shutdown за 5 секунд.
  # Grace period 30s — с запасом.
  graceful:
    build:
      context: ./app
    image: graceful-go:1.0
    container_name: ${COMPOSE_PROJECT_NAME}-graceful
    command: ["server"]
    ports:
      - "127.0.0.1:8081:8080"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # SLOW — медленный shutdown за 25 секунд.
  # Grace period 30s — впритык.
  slow:
    build:
      context: ./app
    image: graceful-go:1.0
    container_name: ${COMPOSE_PROJECT_NAME}-slow
    command: ["server-slow"]
    ports:
      - "127.0.0.1:8082:8080"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # SHORT-GRACE — медленный shutdown, но grace 5 секунд.
  # SIGKILL убьёт на середине. ПЛОХО.
  short-grace:
    build:
      context: ./app
    image: graceful-go:1.0
    container_name: ${COMPOSE_PROJECT_NAME}-short-grace
    command: ["server-slow"]
    ports:
      - "127.0.0.1:8083:8080"
    stop_signal: SIGTERM
    stop_grace_period: 5s
    restart: unless-stopped

  # NO-GRACE — без обработки SIGTERM.
  # Умирает мгновенно по default handler. ПЛОХО.
  no-grace:
    build:
      context: ./app
    image: graceful-go:1.0
    container_name: ${COMPOSE_PROJECT_NAME}-no-grace
    command: ["server-no-grace"]
    ports:
      - "127.0.0.1:8084:8080"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped