# 1. ПРОСТОЙ POD — один контейнер (90% случаев)
apiVersion: v1
kind: Pod
metadata:
  name: simple
  label:
    app: simple
spec:
  containers:
  - name: app
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80
---

# 2. POD С INIT-КОНТЕЙНЕРОМ — подготовка перед стартом
#    Init запускается первым, завершается, потом основной.
apiVersion: v1
kind: Pod
metadata:
  name: with-init
spec:
  # Init-контейнер: выполняется до основного, должен завершиться с 0.
  initContainers:
  - name: prepare-data
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "init: preparing data"
      mkdir -p /data
      echo "prepared at $(date)" > /data/ready.txt
      sleep 2
      echo "init: done"
    volumeMounts:
    - name: data
      mountPath: /data

  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "app started"
      cat /data/ready.txt
      sleep 3600
    volumeMounts:
    - name: data
      mountPath: /data

  volumes:
  - name: data
    emptyDir: {}
---

# 3. POD С SIDECAR — вспомогательный контейнер рядом
#    Оба видят общий volume. App пишет, sidecar читает.
apiVersion: v1
kind: Pod
metadata:
  name: with-sidecar
spec: 
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        echo "$(date) tick" >> /var/log/app.log
        sleep 3
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log

  - name: log-reader
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      tail -f /var/log/app.log
    volumeMounts:
      - name: logs
        mountPath: /var/log
        readOnle: true

  volumes:
  - name: logs
    emtyDir: {}      


    