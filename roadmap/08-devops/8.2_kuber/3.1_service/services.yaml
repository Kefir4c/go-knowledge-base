# 1. NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---

# 2. DEPLOYMENT — источник Pod'ов для всех Service'ов
#    3 реплики nginx с label app=app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: demo
  labels:
   app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app   
  template:
    metadata:
      labels:
        app: app    
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---

# 3. SERVICE: ClusterIP — дефолт, только внутри кластера
apiVersion: v1
kind: Service
metadata:
  name: app-clusterip
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
  - name: http
    port: 80
    targetPort: 80
---

# 4. SERVICE: NodePort — порт на каждой ноде
apiVersion: v1
kind: Service
metadata:
  name: app-nodeport
  namespace: demo
spec:
  type: NodePort
  selector:
    app: app
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
---

# 5. SERVICE: Headless — clusterIP: None
#    DNS отдаёт IP каждого Pod'а
apiVersion: v1
kind: Service
metadata:
  name: app-headless
  namespace: demo
spec:
  clusterIP: None
  selector:
    app: app
  ports:
  - name: http
    port: 80
    targetPort: 80
---

# 6. SERVICE: ExternalName — CNAME на внешний DNS
apiVersion: v1
kind: Service
metadata:
  name: external-httpbin
  namespace: demo
spec:
  type: ExternalName
  externalName: httpbin.org
---

# 7. SERVICE: LoadBalancer — облачный LB (в Killercoda
#    EXTERNAL-IP будет <pending> — это нормально)
apiVersion: v1
kind: Service
metadata:
  name: app-loadbalancer
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app: app
  ports:
  - name: http
    port: 80
    targetPort: 80
---

# 8. SERVICE: sessionAffinity — sticky sessions по IP клиента
apiVersion: v1
kind: Service
metadata:
  name: app-sticky
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 80
    targetPort: 80

---

# 9. ДЕМО: Pod с nginx, возвращающий своё имя
#    Чтобы было видно, на какой Pod попал запрос.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            memory: "64Mi"
---

# 10. SERVICE для whoami — посмотрим балансировку
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80