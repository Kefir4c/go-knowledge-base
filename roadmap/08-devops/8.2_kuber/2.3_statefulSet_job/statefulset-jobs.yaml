# 1. NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---

# 2. SECRET — пароли для Postgres
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: demo
type: Opaque
stringData:
  POSTGRES_USER: "app"
  POSTGRES_PASSWORD: "supersecret"
  POSTGRES_DB: "app"
---

# 3. HEADLESS SERVICE — обязательный спутник StatefulSet
#    clusterIP: None → DNS отдаёт IP каждого Pod'а отдельно
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  clusterIP: none
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---

# 4. STATEFULSET — Postgres с постоянным PVC
#    Имя postgres-0, свой PVC data-postgres-0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: demo
spec:
  serviceName: postgres       # имя Headless Service
  replicas: 1                 # для демо 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: pg-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---

# 5. JOB — миграции (одноразовая задача)
#    Запускается до основного приложения.
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
  namespace: demo
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: pg-secret
          command:
            - sh
            - -c
            - |
              echo "applying migrations..."
              PGPASSWORD=$POSTGRES_PASSWORD psql \
                -h postgres-0.postgres.demo.svc.cluster.local \
                -U $POSTGRES_USER -d $POSTGRES_DB \
                -c "CREATE TABLE IF NOT EXISTS visits (id BIGSERIAL PRIMARY KEY, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
              echo "done"

---

# 6. CRONJOB — бэкап каждые 5 минут (для демо)
#    concurrencyPolicy: Forbid — не запускать два одновременно
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: pg-secret
              command:
                - sh
                - -c
                - |
                  echo "backup at $(date)"
                  PGPASSWORD=$POSTGRES_PASSWORD pg_dump \
                    -h postgres-0.postgres.demo.svc.cluster.local \
                    -U $POSTGRES_USER $POSTGRES_DB > /tmp/backup.sql
                  echo "backup size: $(wc -c < /tmp/backup.sql) bytes"