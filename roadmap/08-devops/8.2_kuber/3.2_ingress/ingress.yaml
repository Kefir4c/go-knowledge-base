# 1. NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---

# 2. APP-1 — nginx (обычный сервис)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: demo
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
          - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSecons: 5      
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app1
  ports:
  - port: 80
    targetPort: 80
---          

# 3. APP-2 — whoami (покажет имя Pod'а и его IP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: demo
  labels:
    app: app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app2
  ports:
  - port: 80
    targetPort: 80
---

# 4. INGRESS: HOST-BASED ROUTING
#    api.example.com   → app1 (nginx)
#    whoami.example.com → app2 (whoami)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name:  host-based
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: api.example.com
  http:
  paths:
  - path: /
    pathType: Prefix
    backend:
      service:
        name: app1
        port:
          number: 80     
  - host: whoami.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2
            port:
              number: 80
---           

# 5. INGRESS: PATH-BASED ROUTING
#    app.example.com/nginx  → app1
#    app.example.com/whoami → app2
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-based
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /nginx(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: app1
            port:
              number: 80
      - path: /whoami(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: app2
            port:
              number: 80
---

# 6. INGRESS: WILDCARD + DEFAULT BACKEND
#    *.example.com → app1 (fallback)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildcard
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
  - host: "*.wildcard.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1
            port:
              number: 80