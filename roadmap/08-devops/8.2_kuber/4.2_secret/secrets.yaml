# 1. NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---

# 2. SECRET OPAQUE — обычный, для паролей
#    stringData — пишем открытым текстом, K8s сам кодирует в base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: demo
  labels:
    app: app
type: Opague
stringData:
  DB_USER: "app"
  DB_PASSWORD: "supersecret"
  API_KEY: "sk-1234567890abcdef"
  JWT_SECRET: "my-jwt-secret-key"
---

# 3. SECRET OPAQUE — через data (уже закодировано в base64)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-b64
  namespace: demo
type: Opaque
data:
  DB_USER: "YXBw"
  DB_PASSWORD: "c3VwZXJzZWNyZXQ="
---

  # 4. POD: Secret через envFrom — все ключи в env
apiVersion: v1
kind: Pod
metadata:
  name: via-envfrom
  namespace: demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "=== env из secret ==="
      env | grep -E "DB_USER|DB_PASSWORD|API_KEY|JWT_SECRET" | sort
      sleep 3600
    enbFrom:
    - secretRef:
      name: app-secret
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "128Mi"         
---

# 5. POD: Secret через env — выборочно
apiVersion: v1
kind: Pod
metadata:
  name: via-env
  namespace: demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "DB_USER=$DB_USER"
      echo "DB_PASSWORD=$DB_PASSWORD"
      sleep 3600
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "128Mi"  
---

# 6. POD: Secret через volume — каждый ключ как файл
#    defaultMode: 0400 — только владелец читает
apiVersion: v1
kind: Pod
metadata:
  name: via-volume
  namespace: demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "=== files ==="
      ls -la /etc/secrets/
      echo "=== DB_USER ==="
      cat /etc/secrets/DB_USER
      echo "=== DB_PASSWORD ==="
      cat /etc/secrets/DB_PASSWORD
      sleep 3600      
    volumeMounts:
    - name: secret
      mountPath: /etc/secrets
      readOnly: true
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "128Mi"      
  volumes:
  - name: secret
    secret:
      secretName: app-secret
      defaultMode: 0400    
---      

# 7. POD: Secret через volume с выборкой ключей
#    Только DB_PASSWORD, переименован в password.txt      
apiVersion: v1
kind: Pod
metadata:
  name: via-volume-items
  namespace: demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      ls -la /etc/secrets/
      cat /etc/secrets/password.txt
      sleep 3600
    volumeMounts:
    - name: secrets
      mountPath: /etc/secrets
      readOnly: true
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
  volumes:
  - name: secrets
    secret:
      secretName: app-secrets
      items:
      - key: DB_PASSWORD
        path: password.txt
---

# 8. SECRET для docker-registry
#    Для доступа к приватному registry.
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: demo
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "user",
          "password": "pass",
          "auth": "dXNlcjpwYXNz"
        }
      }
    }
---

# 9. POD: использует docker-registry secret
#    imagePullSecrets — для скачивания образа из приватного registry
apiVersion: v1
kind: Pod
metadata:
  name: with-image-pull-secret
  namespace: demo
spec:
  imagePullSecrets:
  - name: docker-registry-secret
  containers:
  - name: app
    image: nginx:1.27-alpine
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "128Mi"  
---

# 10. SECRET TLS — структура для HTTPS-сертификата
#     Реальный сертификат создаётся через kubectl create secret tls.
apiVersion: v1
kind: Secret
metadata:
  name: example-tls
  namespace: demo
type: kubernetes.io/tls
data:
  # base64 от содержимого файлов tls.crt и tls.key.
  # Реальные значения НЕ здесь — использовать kubectl create.
  tls.crt: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t"
  tls.key: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t"
---

# 11. DEPLOYMENT, использующий Secret через env
#     Реальный Go-сервис, который читает DB_USER и DB_PASSWORD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: demo
  labels:
    app: app
spec:
  replicas: 2
  selector:
    mathLabels:
      app: app
  template:
    metadata:
      labels:
       app: app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "started with DB_USER=$DB_USER"
          echo "password length: $([ -n "$DB_PASSWORD" ] && echo 'set' || echo 'missing')"
          sleep 3600
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD     
        resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "128Mi"         
              